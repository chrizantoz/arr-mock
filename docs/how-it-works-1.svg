<svg xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#ffffff" viewBox="0 0 1400 800" role="img" aria-label="Your app talks HTTP to arr-mock, one process that answers as four services from an in-memory world and real files on disk; every write it receives is recorded for your test to read."><rect width="100%" height="100%" rx="12" fill="#ffffff"/>
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17201f"/></marker>
        <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f8a74"/></marker>
      </defs>
      <g font-size="16" fill="#17201f" stroke="#17201f">
        <rect x="40" y="230" width="280" height="170" rx="14" fill="#ffffff" stroke-width="1.6"/>
        <text x="180" y="290" text-anchor="middle" font-size="24" font-weight="600" stroke="none">Your app</text>
        <text x="180" y="326" text-anchor="middle" fill="#5f6f6c" stroke="none">the thing under test</text>
        <text x="180" y="354" text-anchor="middle" fill="#5f6f6c" stroke="none">Auditarr, a script, anything</text>
        <line x1="320" y1="280" x2="538" y2="280" stroke-width="1.6" marker-end="url(#arr)"/>
        <text x="430" y="258" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="15">GET / POST · key: test</text>
        <line x1="538" y1="350" x2="320" y2="350" stroke-width="1.6" marker-end="url(#arr)"/>
        <text x="430" y="384" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="15">JSON, like the real thing</text>
        <rect x="540" y="60" width="460" height="620" rx="18" fill="#dff3ee" stroke="#0f8a74" stroke-width="2.2"/>
        <text x="770" y="108" text-anchor="middle" font-size="26" font-weight="600" fill="#0f8a74" stroke="none">arr-mock</text>
        <text x="770" y="136" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="15">one Python process · port 8765</text>
        <g stroke="#0f8a74" stroke-width="1.4" fill="#ffffff"><rect x="566" y="166" width="196" height="60" rx="10"/><rect x="778" y="166" width="196" height="60" rx="10"/><rect x="566" y="242" width="196" height="60" rx="10"/><rect x="778" y="242" width="196" height="60" rx="10"/></g>
        <g font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="18" stroke="none" text-anchor="middle"><text x="664" y="203">/sonarr</text><text x="876" y="203">/radarr</text><text x="664" y="279">/whisparr</text><text x="876" y="279">/bazarr</text></g>
        <rect x="566" y="332" width="408" height="130" rx="12" fill="#ffffff" stroke="#0f8a74" stroke-width="1.4"/>
        <text x="770" y="372" text-anchor="middle" font-size="20" font-weight="600" stroke="none">the "world", a Python dict</text>
        <text x="770" y="404" text-anchor="middle" fill="#5f6f6c" stroke="none">shows · episodes · files · movies · tags · wanted list</text>
        <text x="770" y="434" text-anchor="middle" fill="#5f6f6c" stroke="none">edit it in your test and the answers change</text>
        <rect x="566" y="492" width="408" height="110" rx="12" fill="#ffffff" stroke="#0f8a74" stroke-width="1.4"/>
        <text x="770" y="532" text-anchor="middle" font-size="20" font-weight="600" stroke="none" font-family="JetBrains Mono,ui-monospace,Menlo,monospace">srv.calls</text>
        <text x="770" y="564" text-anchor="middle" fill="#5f6f6c" stroke="none">every POST, PUT, PATCH and DELETE it received</text>
        <rect x="1080" y="230" width="280" height="170" rx="14" fill="#ffffff" stroke-width="1.6"/>
        <text x="1220" y="290" text-anchor="middle" font-size="22" font-weight="600" stroke="none">Real files on disk</text>
        <text x="1220" y="326" text-anchor="middle" fill="#5f6f6c" stroke="none">tiny MKVs made by synthlib</text>
        <text x="1220" y="354" text-anchor="middle" fill="#5f6f6c" stroke="none">ffmpeg · 30 s · any language</text>
        <line x1="1000" y1="300" x2="1078" y2="300" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
        <text x="1039" y="276" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="15">exists?</text>
        <text x="1180" y="440" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="15">a file only exists for Sonarr</text>
        <text x="1180" y="464" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="15">when it is really there</text>
        <path d="M180 400 C180 720, 700 740, 1300 740 L1300 402" fill="none" stroke-width="1.6" stroke-dasharray="7 7" marker-end="url(#arr)"/>
        <text x="700" y="776" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="16">your app reads, moves or fixes the files exactly as it would in production</text>
        <path d="M566 548 C440 548, 300 560, 180 560 L180 402" fill="none" stroke="#0f8a74" stroke-width="1.8" marker-end="url(#arrA)"/>
        <text x="380" y="536" text-anchor="middle" fill="#0f8a74" stroke="none" font-size="16" font-weight="600">your test asserts on it</text>
      </g>
    </svg>