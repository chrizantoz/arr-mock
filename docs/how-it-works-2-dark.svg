<svg xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#162021" viewBox="0 0 920 250" role="img" aria-label="In chaos mode each request passes a gate: most reach the fake service, eight percent get a 500, four percent are delayed, and one app drops the connection for a window of requests."><rect width="100%" height="100%" rx="12" fill="#162021"/>
      <g font-size="13" fill="#e4ecea" stroke="#e4ecea">
        <!-- incoming requests -->
        <text x="20" y="44" font-weight="600" stroke="none">requests from your app</text>
        <g stroke="none" fill="#e4ecea"><circle cx="28" cy="80" r="5"/><circle cx="52" cy="80" r="5"/><circle cx="76" cy="80" r="5"/><circle cx="100" cy="80" r="5"/><circle cx="124" cy="80" r="5"/><circle cx="148" cy="80" r="5"/><circle cx="172" cy="80" r="5"/></g>
        <line x1="190" y1="80" x2="280" y2="80" stroke-width="1.5" marker-end="url(#arr)"/>
        <!-- gate -->
        <rect x="282" y="30" width="150" height="100" rx="12" fill="#153832" stroke="#3dd6b4" stroke-width="2"/>
        <text x="357" y="66" text-anchor="middle" font-weight="600" fill="#3dd6b4" stroke="none">chaos gate</text>
        <text x="357" y="86" text-anchor="middle" fill="#93a5a1" stroke="none" font-size="12">seeded random</text>
        <text x="357" y="104" text-anchor="middle" fill="#93a5a1" stroke="none" font-size="12">same run every time</text>
        <!-- outcomes -->
        <line x1="432" y1="60" x2="540" y2="42" stroke-width="1.5" marker-end="url(#arr)"/>
        <line x1="432" y1="80" x2="540" y2="100" stroke-width="1.5" marker-end="url(#arr)"/>
        <line x1="432" y1="100" x2="540" y2="158" stroke-width="1.5" marker-end="url(#arr)"/>
        <line x1="432" y1="115" x2="540" y2="216" stroke-width="1.5" marker-end="url(#arr)"/>
        <rect x="544" y="22" width="356" height="40" rx="8" fill="#162021" stroke-width="1.2"/>
        <text x="560" y="47" stroke="none"><tspan font-weight="600">88 %</tspan> normal answer from the fake service</text>
        <rect x="544" y="80" width="356" height="40" rx="8" fill="#3f1d1d" stroke="#ff8585" stroke-width="1.2"/>
        <text x="560" y="105" stroke="none"><tspan font-weight="600" fill="#ff8585">8 %</tspan> HTTP 500 <tspan fill="#93a5a1">{"error": "chaos"}</tspan></text>
        <rect x="544" y="138" width="356" height="40" rx="8" fill="#3a2c12" stroke="#f0b35c" stroke-width="1.2"/>
        <text x="560" y="163" stroke="none"><tspan font-weight="600" fill="#f0b35c">4 %</tspan> answered after a 2 s sleep</text>
        <rect x="544" y="196" width="356" height="40" rx="8" fill="#3f1d1d" stroke="#ff8585" stroke-width="1.2"/>
        <text x="560" y="221" stroke="none"><tspan font-weight="600" fill="#ff8585">radarr, requests 2–13</tspan> connection dropped, no reply</text>
        <text x="20" y="170" font-weight="600" stroke="none">what your app must do</text>
        <text x="20" y="192" fill="#93a5a1" stroke="none">finish the run, mark Radarr as unreachable,</text>
        <text x="20" y="210" fill="#93a5a1" stroke="none">keep the findings it already had for Radarr,</text>
        <text x="20" y="228" fill="#93a5a1" stroke="none">send no half-done write, recover next run.</text>
      </g>
    </svg>