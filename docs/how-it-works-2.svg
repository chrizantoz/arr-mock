<svg xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#ffffff" viewBox="0 0 1400 520" role="img" aria-label="In chaos mode each request passes a gate: most reach the fake service, eight percent get a 500, four percent are delayed, and one app drops the connection for a window of requests."><rect width="100%" height="100%" rx="12" fill="#ffffff"/>
      <g font-size="16" fill="#17201f" stroke="#17201f">
        <text x="40" y="70" font-size="20" font-weight="600" stroke="none">Requests from your app</text>
        <g stroke="none" fill="#17201f"><circle cx="52" cy="126" r="8"/><circle cx="88" cy="126" r="8"/><circle cx="124" cy="126" r="8"/><circle cx="160" cy="126" r="8"/><circle cx="196" cy="126" r="8"/><circle cx="232" cy="126" r="8"/><circle cx="268" cy="126" r="8"/></g>
        <line x1="290" y1="126" x2="418" y2="126" stroke-width="1.6" marker-end="url(#arr)"/>
        <rect x="420" y="56" width="240" height="140" rx="16" fill="#dff3ee" stroke="#0f8a74" stroke-width="2.2"/>
        <text x="540" y="112" text-anchor="middle" font-size="22" font-weight="600" fill="#0f8a74" stroke="none">chaos gate</text>
        <text x="540" y="144" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="15">seeded random</text>
        <text x="540" y="168" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="15">same run every time</text>
        <g stroke-width="1.6"><line x1="660" y1="96" x2="758" y2="70" marker-end="url(#arr)"/><line x1="660" y1="118" x2="758" y2="170" marker-end="url(#arr)"/><line x1="660" y1="140" x2="758" y2="270" marker-end="url(#arr)"/><line x1="660" y1="162" x2="758" y2="370" marker-end="url(#arr)"/></g>
        <rect x="760" y="36" width="600" height="68" rx="12" fill="#ffffff" stroke-width="1.4"/>
        <text x="784" y="78" stroke="none" font-size="18"><tspan font-weight="600">88 %</tspan>  normal answer from the fake service</text>
        <rect x="760" y="136" width="600" height="68" rx="12" fill="#fbe4e4" stroke="#b63a3a" stroke-width="1.4"/>
        <text x="784" y="178" stroke="none" font-size="18"><tspan font-weight="600" fill="#b63a3a">8 %</tspan>  HTTP 500 with <tspan font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="16">{"error": "chaos"}</tspan></text>
        <rect x="760" y="236" width="600" height="68" rx="12" fill="#fdf0dc" stroke="#b4680a" stroke-width="1.4"/>
        <text x="784" y="278" stroke="none" font-size="18"><tspan font-weight="600" fill="#b4680a">4 %</tspan>  answered after a 2-second sleep</text>
        <rect x="760" y="336" width="600" height="68" rx="12" fill="#fbe4e4" stroke="#b63a3a" stroke-width="1.4"/>
        <text x="784" y="378" stroke="none" font-size="18"><tspan font-weight="600" fill="#b63a3a">Radarr, requests 2 to 13</tspan>  connection dropped, no reply</text>
        <text x="40" y="300" font-size="20" font-weight="600" stroke="none">What your app must do</text>
        <text x="40" y="336" fill="#5f6f6c" stroke="none">finish the run and mark Radarr as unreachable</text>
        <text x="40" y="366" fill="#5f6f6c" stroke="none">keep the findings it already had for Radarr</text>
        <text x="40" y="396" fill="#5f6f6c" stroke="none">send no half-done write, recover on the next run</text>
      </g>
    </svg>